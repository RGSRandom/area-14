<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Email - A14MAIL</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand"><div class="brand-mark">A14</div>A14MAIL</div>
            <a class="nav-link" href="{{ url_for('inbox') }}">Inbox</a>
            <a class="nav-link" href="{{ url_for('sent') }}">Sent</a>
            <a class="nav-link" href="{{ url_for('compose') }}">Compose</a>
            {% if role == 'admin' %}
            <a class="nav-link" href="{{ url_for('admin_users') }}">Users</a>
            {% endif %}
            <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
            <div class="sidebar-foot">{{ user }}{% if role == 'admin' %} · Admin{% endif %}</div>
        </aside>

        <main class="main">
            <div class="box wide" style="margin: 0;">
                <h2>{{ email.subject }}</h2>
                <p class="meta"><b>From</b> {{ email.from }}</p>
                <p class="meta"><b>To</b> {{ email.to | join(", ") }}</p>
                <p class="meta"><b>Date</b> {{ email.timestamp }}</p>
                <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">
                <pre class="letter">{{ email.body }}</pre>
            </div>
        </main>
    </div>
</body>
</html>
